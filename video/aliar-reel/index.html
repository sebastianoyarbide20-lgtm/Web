<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ALIAR ROSARIO · Reel Farmacias Fundadoras</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fff9f0;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="26"
      data-width="1080"
      data-height="1920"
    >
      <!-- Escenas (un compás = 2 s a 120 BPM) -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="red" data-composition-id="red" data-composition-src="compositions/red.html"
        data-start="4" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="online" data-composition-id="online" data-composition-src="compositions/online.html"
        data-start="10" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="recetas" data-composition-id="recetas" data-composition-src="compositions/recetas.html"
        data-start="12" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="barrios" data-composition-id="barrios" data-composition-src="compositions/barrios.html"
        data-start="14" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="duenio" data-composition-id="duenio" data-composition-src="compositions/duenio.html"
        data-start="16" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="costo" data-composition-id="costo" data-composition-src="compositions/costo.html"
        data-start="18" data-duration="3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html"
        data-start="21" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"
        data-variable-values='{"deadline":"Inscripción hasta el 10 de diciembre","cta":"Postular mi farmacia","launch":"Lanzamiento: 1.º de enero de 2027"}'></div>

      <!-- Música: base sintetizada en código (audio-src/score.js), 120 BPM -->
      <audio id="musica" src="assets/audio/musica.mp3" data-start="0" data-duration="26" data-track-index="3" data-volume="1.12"></audio>

      <!-- Efectos (Pixabay, ver assets/audio/sfx/CREDITS.md). Cada pico cae ~1 cuadro después de su imagen. -->
      <audio id="sfx-pop-modulo" src="assets/audio/sfx/pop.mp3" data-start="3.3" data-duration="0.4" data-track-index="4" data-volume="0.896"></audio>
      <audio id="sfx-pop-fisherton" src="assets/audio/sfx/pop.mp3" data-start="6.38" data-duration="0.4" data-track-index="4" data-volume="0.784"></audio>
      <audio id="sfx-pop-alberdi" src="assets/audio/sfx/pop.mp3" data-start="6.88" data-duration="0.4" data-track-index="4" data-volume="0.896"></audio>
      <audio id="sfx-ping-punto" src="assets/audio/sfx/ping.mp3" data-start="7.04" data-duration="1" data-track-index="5" data-volume="0.672"></audio>
      <audio id="sfx-whoosh-isotipo" src="assets/audio/sfx/whoosh-short.mp3" data-start="8.69" data-duration="0.5" data-track-index="4" data-volume="0.392"></audio>
      <audio id="sfx-whoosh-iris" src="assets/audio/sfx/whoosh.mp3" data-start="9.77" data-duration="0.5" data-track-index="4" data-volume="0.504"></audio>
      <audio id="sfx-pedido" src="assets/audio/sfx/notification.mp3" data-start="10.25" data-duration="1.4" data-track-index="5" data-volume="0.784" data-fade-out="0.2"></audio>
      <audio id="sfx-pop-receta" src="assets/audio/sfx/pop.mp3" data-start="12.66" data-duration="0.4" data-track-index="4" data-volume="0.896"></audio>
      <audio id="sfx-whoosh-cinta" src="assets/audio/sfx/whoosh.mp3" data-start="13.89" data-duration="0.5" data-track-index="4" data-volume="0.392"></audio>
      <audio id="sfx-whoosh-mundo" src="assets/audio/sfx/whoosh-cinematic.mp3" data-start="15.3" data-media-start="1.9" data-duration="1.3" data-track-index="4" data-volume="0.336" data-fade-out="0.3"></audio>
      <audio id="sfx-pop-negocio" src="assets/audio/sfx/pop.mp3" data-start="16.68" data-duration="0.4" data-track-index="4" data-volume="0.672"></audio>
      <audio id="sfx-pop-clientes" src="assets/audio/sfx/pop.mp3" data-start="17.18" data-duration="0.4" data-track-index="4" data-volume="0.784"></audio>
      <audio id="sfx-ping-cero" src="assets/audio/sfx/ping.mp3" data-start="17.78" data-duration="1" data-track-index="4" data-volume="0.616"></audio>
      <audio id="sfx-subida" src="assets/audio/sfx/riser.mp3" data-start="20.4" data-media-start="2.45" data-duration="1.2" data-track-index="4" data-volume="0.246" data-fade-out="0.15"></audio>
      <audio id="sfx-golpe-logo" src="assets/audio/sfx/impact-bass-1.mp3" data-start="21.33" data-duration="2" data-track-index="5" data-volume="0.392"></audio>
      <audio id="sfx-pop-boton" src="assets/audio/sfx/pop.mp3" data-start="22.82" data-duration="0.4" data-track-index="4" data-volume="0.896"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
