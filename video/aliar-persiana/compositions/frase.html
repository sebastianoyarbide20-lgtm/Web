    (function () {
      const tl = gsap.timeline({ paused: true });
      // golpe: el bloque entra grande y aterriza (expo.out)
      const SLAM = (sel, at, from = 1.5, d = 0.22) => tl.fromTo(sel, { opacity: 0, scale: from, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: d, ease: "expo.out" }, at);

      // temblor de impacto (3 ciclos)
      const SHAKE = (sel, at, a = 16) => { [[a, 0.045], [-a * 0.75, 0.05], [a * 0.45, 0.05], [0, 0.06]].reduce((t, [y, d], i, arr) => { const prev = i ? arr[i - 1][0] : 0; tl.fromTo(sel, { y: prev }, { y, duration: d, ease: "sine.inOut", immediateRender: false }, t); return t + d; }, at); };

      SLAM("#fr-l1", 0.04, 1.7); SLAM("#fr-l2", 0.18, 1.7);

      // 1,35 · zoom a través hacia el cierre Crema
      tl.fromTo("#fr-z", { scale: 1, transformOrigin: "40% 55%" }, { scale: 2.8, duration: 0.25, ease: "power3.in", immediateRender: false }, 1.35);
      tl.fromTo("#fr-cover", { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, 1.48);
      window.__timelines["frase"] = tl;
