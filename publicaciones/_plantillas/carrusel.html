<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Plantilla · Carrusel 1:1</title>
<link rel="stylesheet" href="../../marca/publicacion.css">
</head>
<body>
<!--
  PLANTILLA CARRUSEL: una .pieza por diapositiva (máx. 10). Se exportan como carrusel-01.png, -02…
  Portada = gancho. Diapositivas internas = una idea cada una, con número en contorno.
  Cierre = una sola acción. Alterná pasteles: dos diapositivas seguidas no repiten color.
-->
<section class="pieza pieza--cuadrada fondo--lima" data-nombre="carrusel-01">
  <span class="pagina">1/3</span>
  <span class="eyebrow" style="background: var(--surface)">Antetítulo</span>
  <h1 class="titular titular--xl">Gancho de la <span class="pildora">portada</span></h1>
  <p class="bajada empuje" style="color: var(--ink)">Deslizá para ver cómo funciona →</p>
  <span class="logo"><span class="logo__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="11.6" y="2.2" width="8.8" height="9.6" rx="2.6"/><rect x="11.6" y="20.2" width="8.8" height="9.6" rx="2.6"/><rect x="2.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><rect x="20.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><circle cx="16" cy="16" r="2.4"/></svg></span><span class="logo__texto">ALIAR <b>ROSARIO</b></span></span>
</section>

<section class="pieza pieza--cuadrada fondo--crema fondo--puntos" data-nombre="carrusel-02">
  <span class="pagina">2/3</span>
  <span class="num">01</span>
  <h2 class="titular titular--m">Una idea por diapositiva</h2>
  <p class="bajada">Explicala en una o dos oraciones cortas.</p>
  <div class="pie empuje"><span class="logo logo--chico"><span class="logo__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="11.6" y="2.2" width="8.8" height="9.6" rx="2.6"/><rect x="11.6" y="20.2" width="8.8" height="9.6" rx="2.6"/><rect x="2.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><rect x="20.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><circle cx="16" cy="16" r="2.4"/></svg></span><span class="logo__texto">ALIAR <b>ROSARIO</b></span></span></div>
</section>

<section class="pieza pieza--cuadrada fondo--lila" data-nombre="carrusel-03">
  <span class="pagina">3/3</span>
  <h2 class="titular">Cierre con <span class="subrayado">una acción</span></h2>
  <p class="bajada" style="color: var(--ink)">Qué tiene que hacer el vecino o la farmacia ahora.</p>
  <span class="btn btn--primario">Verbo + objeto</span>
  <div class="pie empuje"><span class="logo"><span class="logo__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="11.6" y="2.2" width="8.8" height="9.6" rx="2.6"/><rect x="11.6" y="20.2" width="8.8" height="9.6" rx="2.6"/><rect x="2.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><rect x="20.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><circle cx="16" cy="16" r="2.4"/></svg></span><span class="logo__texto">ALIAR <b>ROSARIO</b></span></span><span class="tag tag--urgente">Plazo o cupo</span></div>
</section>
</body>
</html>
