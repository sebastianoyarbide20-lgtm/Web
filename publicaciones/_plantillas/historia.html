<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Plantilla · Historia 9:16 (1080 × 1920)</title>
<link rel="stylesheet" href="../../marca/publicacion.css">
</head>
<body>
<!--
  PLANTILLA HISTORIA 9:16. Deja 250 px libres arriba y abajo (barra y respuesta de Instagram).
  El fondo puede ocupar toda la pieza; el texto y el logo, no.
-->
<section class="pieza pieza--historia fondo--menta fondo--puntos" data-nombre="historia">
  <span class="eyebrow">Antetítulo</span>
  <h1 class="titular titular--xl">Titular con una <span class="subrayado">palabra clave</span></h1>
  <p class="bajada">Una sola oración, simple y práctica.</p>
  <div class="card card--manteca">
    <p class="card__titulo">Dato o paso concreto</p>
    <p class="texto">Detalle en una o dos líneas.</p>
  </div>
  <span class="btn btn--whatsapp">Escribinos por WhatsApp</span>
  <div class="pie empuje">
    <span class="logo"><span class="logo__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="11.6" y="2.2" width="8.8" height="9.6" rx="2.6"/><rect x="11.6" y="20.2" width="8.8" height="9.6" rx="2.6"/><rect x="2.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><rect x="20.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><circle cx="16" cy="16" r="2.4"/></svg></span><span class="logo__texto">ALIAR <b>ROSARIO</b></span></span>
  </div>
</section>
</body>
</html>
