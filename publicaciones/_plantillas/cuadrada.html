<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Plantilla · Publicación 1:1 (1080 × 1080)</title>
<link rel="stylesheet" href="../../marca/publicacion.css">
</head>
<body>
<!--
  PLANTILLA 1:1 (guía 14.2). Copiá esta carpeta a publicaciones/AAAA-MM-DD-slug/ y reemplazá los textos.
  1. Fondo: un pastel o Crema (fondo--menta | lima | lila | manteca | crema), puntos opcionales.
  2. Titular Bricolage 800, 6 a 10 palabras, UNA palabra resaltada (.pildora o .subrayado).
  3. Bajada: una sola oración.
  4. Un sticker: fecha, novedad o urgencia.
  5. Logotipo abajo con su área de respeto.
  Coral solo en .btn--primario o .tag--urgente. Máximo un "!" por pieza.
-->
<section class="pieza pieza--cuadrada fondo--crema fondo--puntos" data-nombre="post">
  <span class="eyebrow">Antetítulo de 3 a 5 palabras</span>
  <h1 class="titular">Titular corto con una palabra <span class="pildora">resaltada</span></h1>
  <p class="bajada">Una sola oración que explica qué es y para quién.</p>
  <div class="pie empuje">
    <span class="logo"><span class="logo__mark"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="11.6" y="2.2" width="8.8" height="9.6" rx="2.6"/><rect x="11.6" y="20.2" width="8.8" height="9.6" rx="2.6"/><rect x="2.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><rect x="20.2" y="11.6" width="9.6" height="8.8" rx="2.6"/><circle cx="16" cy="16" r="2.4"/></svg></span><span class="logo__texto">ALIAR <b>ROSARIO</b></span></span>
    <span class="tag tag--solida tag--inclinada">Sticker</span>
  </div>
</section>
</body>
</html>
